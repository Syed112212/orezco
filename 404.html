<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Orezco</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;600&display=swap">
<style>
:root{
  color-scheme:light;
  --verde:#2bee4b;--musgo:#93b799;--eco:#c4e4c9;
  --prensa:#121613;--gris:#516254;--hueso:#fafffa;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--hueso);color:var(--prensa);
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:grid;place-items:center;padding:clamp(24px,6vw,64px);text-align:center;
}
main{display:grid;gap:22px;justify-items:center;max-width:44ch}
svg.mark{width:60px;height:60px;color:var(--prensa)}
p.label{
  font-size:11px;font-weight:600;letter-spacing:.01em;text-transform:uppercase;
  color:var(--gris);margin:0;
}
h1{
  font-family:"Instrument Serif",Georgia,serif;font-weight:400;
  font-size:clamp(2.6rem,9vw,5rem);line-height:.9;letter-spacing:-.04em;
  margin:0;text-wrap:balance;
}
p.lede{margin:0;color:var(--gris);font-size:1rem;line-height:1.6}
a.btn{
  display:inline-flex;align-items:center;
  font-size:13px;font-weight:600;letter-spacing:.01em;text-transform:uppercase;
  padding:12px 22px;border-radius:5px;text-decoration:none;
  background:var(--verde);color:var(--prensa);
  box-shadow:0 2px 0 var(--musgo);
}
a.btn:focus-visible{outline:2px solid var(--prensa);outline-offset:3px}
</style>
</head>
<body>
<main>
  <svg class="mark" viewBox="0 0 200 200" aria-hidden="true">
    <polygon points="100,26 166,63 166,137 100,174 34,137 34,63"
             fill="currentColor" stroke="currentColor" stroke-width="26" stroke-linejoin="round"/>
    <g stroke="#fafffa" stroke-width="13" stroke-linecap="round" fill="none">
      <path d="M100 100 L38 64"/><path d="M100 100 L162 64"/><path d="M100 100 L100 172"/>
    </g>
    <g stroke="currentColor" stroke-width="15" stroke-linecap="round" fill="none">
      <path d="M100 44 L100 156"/><path d="M51.5 72 L148.5 128"/><path d="M51.5 128 L148.5 72"/>
    </g>
  </svg>
  <p class="label">Error 404</p>
  <h1>Esta página no existe</h1>
  <p class="lede">El enlace está roto o la página se movió de sitio.</p>
  <a class="btn" href="/">Volver al inicio</a>
</main>
</body>
</html>
