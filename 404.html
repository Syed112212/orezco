<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Orezco</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400&display=swap">
<style>
:root{
  color-scheme:light;
  --papel:#ffffff;--mist:#f2f2f3;--hairline:#ececec;
  --tinta:#17191c;--pizarra:#777b86;--ceniza:#979799;
  --serif:"Source Serif 4",ui-serif,Georgia,serif;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--papel);color:var(--tinta);
  font-family:var(--sans);font-size:17px;line-height:1.35;
  display:grid;place-items:center;padding:24px;text-align:center;
  -webkit-font-smoothing:antialiased;
}
main{display:grid;gap:24px;justify-items:center;max-width:44ch}

/* el logo, en 3D tambien aqui */
.zona{perspective:900px;display:grid;place-items:center;height:170px}
.cubo{
  --l:96px;position:relative;width:var(--l);height:var(--l);
  transform-style:preserve-3d;animation:giro 24s linear infinite;
  filter:drop-shadow(0 14px 18px rgba(0,0,0,.09));
}
@keyframes giro{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
.cara{
  position:absolute;inset:0;display:grid;place-items:center;
  background:var(--papel);border:1px solid rgba(4,23,43,.1);
  border-radius:2px;backface-visibility:hidden;
}
.cara svg{width:58%;height:58%;color:var(--tinta);opacity:.9}
.f1{transform:translateZ(calc(var(--l)/2))}
.f2{transform:rotateY(180deg) translateZ(calc(var(--l)/2))}
.f3{transform:rotateY(90deg) translateZ(calc(var(--l)/2));background:var(--mist)}
.f4{transform:rotateY(-90deg) translateZ(calc(var(--l)/2));background:var(--mist)}
.f5{transform:rotateX(90deg) translateZ(calc(var(--l)/2));background:#fdfdfd}
.f6{transform:rotateX(-90deg) translateZ(calc(var(--l)/2));background:var(--mist)}
@media(prefers-reduced-motion:reduce){.cubo{animation:none}}

.cod{font-size:14px;color:var(--ceniza);margin:0}
h1{
  margin:0;font-family:var(--serif);font-weight:400;color:var(--tinta);
  font-size:clamp(32px,7vw,64px);letter-spacing:-.015em;line-height:1.3;
}
p.lede{margin:0;color:var(--pizarra);font-size:18px;font-weight:430;line-height:1.5}
a.btn{
  display:inline-flex;align-items:center;background:var(--tinta);color:var(--papel);
  border:1px solid var(--tinta);border-radius:9999px;padding:12px 20px;
  font-size:16px;font-weight:400;text-decoration:none;
}
a.btn:hover,a.btn:focus-visible{background:#000}
:focus-visible{outline:2px solid var(--tinta);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="zona" aria-hidden="true">
    <div class="cubo">
      <div class="cara f1"><svg viewBox="0 0 200 200"><g stroke="currentColor" stroke-width="15" stroke-linecap="round" fill="none"><path d="M100 30 L100 170"/><path d="M38.5 65 L161.5 135"/><path d="M38.5 135 L161.5 65"/></g></svg></div>
      <div class="cara f2"><svg viewBox="0 0 200 200"><g stroke="currentColor" stroke-width="15" stroke-linecap="round" fill="none"><path d="M100 30 L100 170"/><path d="M38.5 65 L161.5 135"/><path d="M38.5 135 L161.5 65"/></g></svg></div>
      <div class="cara f3"><svg viewBox="0 0 200 200"><g stroke="currentColor" stroke-width="15" stroke-linecap="round" fill="none"><path d="M100 30 L100 170"/><path d="M38.5 65 L161.5 135"/><path d="M38.5 135 L161.5 65"/></g></svg></div>
      <div class="cara f4"><svg viewBox="0 0 200 200"><g stroke="currentColor" stroke-width="15" stroke-linecap="round" fill="none"><path d="M100 30 L100 170"/><path d="M38.5 65 L161.5 135"/><path d="M38.5 135 L161.5 65"/></g></svg></div>
      <div class="cara f5"><svg viewBox="0 0 200 200"><g stroke="currentColor" stroke-width="15" stroke-linecap="round" fill="none"><path d="M100 30 L100 170"/><path d="M38.5 65 L161.5 135"/><path d="M38.5 135 L161.5 65"/></g></svg></div>
      <div class="cara f6"><svg viewBox="0 0 200 200"><g stroke="currentColor" stroke-width="15" stroke-linecap="round" fill="none"><path d="M100 30 L100 170"/><path d="M38.5 65 L161.5 135"/><path d="M38.5 135 L161.5 65"/></g></svg></div>
    </div>
  </div>
  <p class="cod">Error 404</p>
  <h1>Esta página no existe</h1>
  <p class="lede">El enlace está roto o la página se movió de sitio.</p>
  <a class="btn" href="/">Volver al inicio</a>
</main>
</body>
</html>
