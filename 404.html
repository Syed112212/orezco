<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Orezco</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<meta name="theme-color" content="#08090a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{
  color-scheme:dark;
  --void:#08090a;--obsidian:#161718;--smoke:#383b3f;
  --paper:#ffffff;--mist:#d0d6e0;--fog:#8a8f98;--lima:#e4f222;
  --ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:var(--void);color:var(--mist);
  font-family:var(--ui);font-size:16px;line-height:1.5;
  font-feature-settings:"cv01" on,"ss03" on,"zero" on;
  display:grid;place-items:center;padding:24px;text-align:center;
  -webkit-font-smoothing:antialiased;
}
main{display:grid;gap:24px;justify-items:center;max-width:44ch}

/* el logo, en 3D tambien aqui */
.zona{perspective:900px;display:grid;place-items:center;height:150px}
.cubo{--l:88px;position:relative;width:var(--l);height:var(--l);
      transform-style:preserve-3d;animation:giro 24s linear infinite}
@keyframes giro{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
.cara{position:absolute;inset:0;display:grid;place-items:center;
      background:var(--obsidian);border:1px solid var(--smoke);border-radius:2px;backface-visibility:hidden}
.cara svg{width:58%;height:58%;color:var(--paper);opacity:.92}
.f1{transform:translateZ(calc(var(--l)/2))}
.f2{transform:rotateY(180deg) translateZ(calc(var(--l)/2))}
.f3{transform:rotateY(90deg) translateZ(calc(var(--l)/2));background:#0d0e10}
.f4{transform:rotateY(-90deg) translateZ(calc(var(--l)/2));background:#0d0e10}
.f5{transform:rotateX(90deg) translateZ(calc(var(--l)/2));background:#212326}
.f6{transform:rotateX(-90deg) translateZ(calc(var(--l)/2))}
@media(prefers-reduced-motion:reduce){.cubo{animation:none}}

.cod{font-family:var(--mono);font-size:12px;color:var(--fog);letter-spacing:-.013em;margin:0}
h1{margin:0;color:var(--paper);font-size:clamp(32px,7vw,48px);font-weight:510;letter-spacing:-.022em;line-height:1}
p.lede{margin:0;color:var(--fog);font-size:15px}
a.btn{
  display:inline-flex;align-items:center;background:var(--lima);color:var(--void);
  border-radius:6px;padding:10px 16px;font-size:14px;font-weight:510;
  letter-spacing:-.011em;text-decoration:none;
}
a.btn:hover{background:#eef95c}
:focus-visible{outline:2px solid var(--lima);outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="zona" aria-hidden="true">
    <div class="cubo">
      <div class="cara f1"><svg viewBox="0 0 200 200"><g stroke="currentColor" stroke-width="15" stroke-linecap="round" fill="none"><path d="M100 30 L100 170"/><path d="M38.5 65 L161.5 135"/><path d="M38.5 135 L161.5 65"/></g></svg></div>
      <div class="cara f2"><svg viewBox="0 0 200 200"><g stroke="currentColor" stroke-width="15" stroke-linecap="round" fill="none"><path d="M100 30 L100 170"/><path d="M38.5 65 L161.5 135"/><path d="M38.5 135 L161.5 65"/></g></svg></div>
      <div class="cara f3"><svg viewBox="0 0 200 200"><g stroke="currentColor" stroke-width="15" stroke-linecap="round" fill="none"><path d="M100 30 L100 170"/><path d="M38.5 65 L161.5 135"/><path d="M38.5 135 L161.5 65"/></g></svg></div>
      <div class="cara f4"><svg viewBox="0 0 200 200"><g stroke="currentColor" stroke-width="15" stroke-linecap="round" fill="none"><path d="M100 30 L100 170"/><path d="M38.5 65 L161.5 135"/><path d="M38.5 135 L161.5 65"/></g></svg></div>
      <div class="cara f5"><svg viewBox="0 0 200 200"><g stroke="currentColor" stroke-width="15" stroke-linecap="round" fill="none"><path d="M100 30 L100 170"/><path d="M38.5 65 L161.5 135"/><path d="M38.5 135 L161.5 65"/></g></svg></div>
      <div class="cara f6"><svg viewBox="0 0 200 200"><g stroke="currentColor" stroke-width="15" stroke-linecap="round" fill="none"><path d="M100 30 L100 170"/><path d="M38.5 65 L161.5 135"/><path d="M38.5 135 L161.5 65"/></g></svg></div>
    </div>
  </div>
  <p class="cod">Error 404</p>
  <h1>Esta página no existe</h1>
  <p class="lede">El enlace está roto o la página se movió de sitio.</p>
  <a class="btn" href="/">Volver al inicio</a>
</main>
</body>
</html>
