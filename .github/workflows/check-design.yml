name: Sistema visual

# Las reglas de DESIGN.md dejan de ser una promesa y pasan a ser una prueba.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar el sistema visual
        run: python scripts/check-design.py
      - name: Voz, sin marcas de escritura automatica
        run: python scripts/check-voz.py
