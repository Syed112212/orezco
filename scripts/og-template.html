<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap">
<style>
  :root{--papel:#fff;--mist:#f2f2f3;--melocoton:#fbe1d1;--sienna:#5d2a1a;
        --tinta:#17191c;--pizarra:#777b86;--ceniza:#979799}
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;overflow:hidden;background:var(--papel);color:var(--tinta);
       font-family:"Inter",system-ui,sans-serif;display:grid;grid-template-columns:1.15fr .85fr;
       align-items:center;padding:0 72px;gap:24px;-webkit-font-smoothing:antialiased}
  .marca{display:flex;align-items:center;gap:10px;margin-bottom:28px}
  .marca svg{width:24px;height:24px;color:var(--tinta)}
  .marca span{font-size:18px;font-weight:500;letter-spacing:-.009em}
  h1{font-family:"Source Serif 4",Georgia,serif;font-weight:400;font-size:62px;
     letter-spacing:-.025em;line-height:1.2;max-width:15ch}
  h1 em{font-style:italic}
  p{margin-top:22px;font-size:19px;color:var(--pizarra);max-width:42ch;line-height:1.45}
  .pills{margin-top:32px;display:flex;gap:12px}
  .p1{background:var(--tinta);color:var(--papel);border-radius:9999px;padding:12px 20px;font-size:16px}
  .p2{border:1px solid var(--tinta);color:var(--tinta);border-radius:9999px;padding:12px 20px;font-size:16px}
  .nota{margin-top:18px;font-size:15px;color:var(--ceniza)}
  .zona{position:relative;perspective:1000px;perspective-origin:50% 44%;display:grid;place-items:center;height:100%}
  .zona::after{content:"";position:absolute;left:50%;bottom:22%;translate:-50% 0;width:280px;height:110px;
               background:radial-gradient(ellipse at center,rgba(4,23,43,.10),rgba(4,23,43,0) 70%)}
  .cubo{--l:210px;position:relative;width:var(--l);height:var(--l);transform-style:preserve-3d;
        transform:rotateX(-20deg) rotateY(-32deg);}
  .cara{position:absolute;inset:0;display:grid;place-items:center;background:var(--papel);
        border:1px solid rgba(4,23,43,.1);border-radius:2px;backface-visibility:hidden}
  .cara svg{width:58%;height:58%;color:var(--tinta);opacity:.9}
  .f1{transform:translateZ(calc(var(--l)/2))}
  .f3{transform:rotateY(90deg) translateZ(calc(var(--l)/2));background:var(--mist)}
  .f5{transform:rotateX(90deg) translateZ(calc(var(--l)/2));background:#fdfdfd}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <mask id="orezco-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
      <path d="M 79.22 26.00 A 24.00 24.00 0 0 1 120.78 26.00 L 153.69 45.00 A 24.00 24.00 0 0 1 174.48 81.00 L 174.48 119.00 A 24.00 24.00 0 0 1 153.69 155.00 L 120.78 174.00 A 24.00 24.00 0 0 1 79.22 174.00 L 46.31 155.00 A 24.00 24.00 0 0 1 25.52 119.00 L 25.52 81.00 A 24.00 24.00 0 0 1 46.31 45.00 Z" fill="#fff"/>
      <g stroke="#000" stroke-width="13" stroke-linecap="round" fill="none"><path d="M 100.00 100.00 L 30.72 60.00"/><path d="M 100.00 100.00 L 169.28 60.00"/><path d="M 100.00 100.00 L 100.00 180.00"/></g>
      <g stroke="#000" stroke-width="15" stroke-linecap="round" fill="none"><path d="M 100.00 48.00 L 100.00 152.00"/><path d="M 145.03 74.00 L 54.97 126.00"/><path d="M 54.97 74.00 L 145.03 126.00"/></g>
    </mask>
  </defs>
  <symbol id="mark" viewBox="0 0 200 200">
    <rect width="200" height="200" fill="currentColor" mask="url(#orezco-mask)"/>
  </symbol>
</svg>
<div>
  <div class="marca">
    <svg viewBox="0 0 200 200" aria-hidden="true"><use href="#mark"/></svg>
    <span>Orezco</span>
  </div>
  <h1>Un ERP que no se te <em>va de las manos</em></h1>
  <p>Contabilidad, facturaci&oacute;n, inventario, compras y ventas en un mismo sitio.</p>
  <div class="pills"><span class="p1">Pedir una demo</span><span class="p2">Ver los m&oacute;dulos</span></div>
  <p class="nota">En desarrollo &middot; Para pymes</p>
</div>
<div class="zona">
  <div class="cubo">
    <div class="cara f1"><svg viewBox="0 0 200 200"><g stroke="currentColor" stroke-width="15" stroke-linecap="round" fill="none"><path d="M100 30 L100 170"/><path d="M38.5 65 L161.5 135"/><path d="M38.5 135 L161.5 65"/></g></svg></div>
    <div class="cara f3"><svg viewBox="0 0 200 200"><g stroke="currentColor" stroke-width="15" stroke-linecap="round" fill="none"><path d="M100 30 L100 170"/><path d="M38.5 65 L161.5 135"/><path d="M38.5 135 L161.5 65"/></g></svg></div>
    <div class="cara f5"><svg viewBox="0 0 200 200"><g stroke="currentColor" stroke-width="15" stroke-linecap="round" fill="none"><path d="M100 30 L100 170"/><path d="M38.5 65 L161.5 135"/><path d="M38.5 135 L161.5 65"/></g></svg></div>
  </div>
</div>
</body></html>
