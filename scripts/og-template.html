<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Quicksand:wght@600&display=swap">
<style>
  /* Plantilla de assets/og.png. Se renderiza con Chrome headless a
     1200x630 desde scripts/build-og.sh o a mano. Debe decir lo mismo
     que la portada: si cambia el titular, se regenera. */
  :root{
    --papel:#f6f5f4;--blanco:#fff;--borde:rgba(0,0,0,.08);
    --tinta:#000;--grafito:#615d59;--piedra:#6a6a6a;
    --azul:#0075de;--marigold:#ffb110;
    --navy:#1E3A5F;--verde:#2FBF9B;--cian:#1F9EC4;--azul-marca:#1E6FB8;
  }
  *{box-sizing:border-box;margin:0}
  body{
    width:1200px;height:630px;overflow:hidden;background:var(--papel);color:var(--tinta);
    font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    padding:64px 72px;display:flex;flex-direction:column;position:relative;
  }
  .marca{display:flex;align-items:center;gap:11px;margin-bottom:auto}
  .marca svg{width:38px;height:38px}
  .marca span{font-family:"Quicksand",sans-serif;font-weight:600;font-size:26px;letter-spacing:-.01em;color:var(--navy)}
  .marca i{font-style:normal;color:var(--verde)}
  h1{font-size:62px;font-weight:600;line-height:1.12;letter-spacing:-.045em;max-width:21ch}
  .resalte{display:inline-block;background:var(--marigold);border-radius:9999px;padding:0 .3em;transform:rotate(-1.2deg)}
  p{margin-top:26px;font-size:22px;color:var(--grafito);max-width:44ch;line-height:1.45}
  .pie{margin-top:auto;display:flex;align-items:center;gap:14px}
  .cta{background:var(--azul);color:#fff;border-radius:8px;padding:12px 20px;font-size:17px;font-weight:500}
  .nota{font-size:16px;color:var(--piedra)}
  /* la escena de sectores, plana, como en la portada */
  .escena{position:absolute;right:-30px;bottom:0;width:520px;opacity:.9}
</style></head><body>

<div class="marca">
  <svg viewBox="0 0 200 200" aria-hidden="true">
    <path d="M 123.56 61.80 A 55.00 55.00 0 1 0 123.56 138.20" fill="none" stroke="#1E3A5F" stroke-width="27" stroke-linecap="round"/>
    <rect x="113.0" y="59.5" width="74.0" height="19.0" rx="9.5" fill="#2FBF9B"/>
    <rect x="113.0" y="90.5" width="74.0" height="19.0" rx="9.5" fill="#1F9EC4"/>
    <rect x="113.0" y="121.5" width="62.0" height="19.0" rx="9.5" fill="#1E6FB8"/>
  </svg>
  <span>cont<i>aes</i></span>
</div>

<h1>El ERP que adem&aacute;s<br><span class="resalte">presenta tus modelos</span></h1>
<p>La IA lleva la contabilidad al d&iacute;a y prepara los modelos. Un asesor los revisa, los firma y los presenta.</p>

<div class="pie">
  <span class="cta">Pedir una demo</span>
  <span class="nota">contaes.com &middot; En desarrollo</span>
</div>

<svg class="escena" viewBox="0 0 520 150" aria-hidden="true">
  <g fill="#f64932" fill-opacity=".22"><rect x="18" y="52" width="6" height="80"/><rect x="0" y="48" width="88" height="5" rx="2.5"/><rect x="76" y="53" width="3" height="20" rx="1.5"/><rect x="70" y="71" width="14" height="10" rx="2"/></g>
  <g fill="#1E3A5F" fill-opacity=".2"><rect x="118" y="88" width="96" height="44" rx="3"/><path d="M118 88 L142 68 L166 88 Z"/><path d="M166 88 L190 68 L214 88 Z"/><rect x="224" y="58" width="16" height="74" rx="3"/></g>
  <g fill="#8b8681" fill-opacity=".16"><circle cx="232" cy="46" r="10"/><circle cx="238" cy="26" r="7"/></g>
  <g fill="#ffb110" fill-opacity=".32"><rect x="256" y="94" width="86" height="38" rx="3"/><path d="M256 94 L299 74 L342 94 Z"/></g>
  <g><rect x="356" y="98" width="68" height="34" rx="3" fill="#62aef0" fill-opacity=".32"/><rect x="351" y="91" width="78" height="9" rx="4" fill="#1F9EC4" fill-opacity=".38"/></g>
  <g fill="#1E3A5F" fill-opacity=".16"><rect x="444" y="60" width="42" height="72" rx="3"/></g>
  <g fill="#2FBF9B" fill-opacity=".5"><rect x="453" y="72" width="8" height="8" rx="2"/><rect x="469" y="72" width="8" height="8" rx="2"/><rect x="453" y="90" width="8" height="8" rx="2"/><rect x="469" y="90" width="8" height="8" rx="2"/></g>
  <rect x="0" y="132" width="520" height="2" fill="#615d59" fill-opacity=".16"/>
</svg>

</body></html>
